# =============================================
# Perfil de produccion: PostgreSQL (Render)
# =============================================
spring.application.name=layers

# Render inyecta estas variables automaticamente cuando
# se vincula una base de datos PostgreSQL al Web Service:
#   PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
#
# IMPORTANTE: Si usas DATABASE_URL manual, debe tener
# el prefijo jdbc:postgresql:// (no solo postgresql://)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Puerto que Render asigna dinamicamente
server.port=${PORT:8080}
