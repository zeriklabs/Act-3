# =============================================
# Perfil de produccion: PostgreSQL (Render)
# =============================================
spring.application.name=layers

# Render provee DATABASE_URL automaticamente.
# La clase DataSourceConfig.java convierte el formato
# postgresql:// -> jdbc:postgresql:// de forma automatica.
# Solo necesitas agregar DATABASE_URL en las env vars de Render.

# JPA / Hibernate - PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Puerto que Render asigna dinamicamente
server.port=${PORT:8080}
